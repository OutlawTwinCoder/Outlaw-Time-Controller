<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Outlaw Time Control</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="panel hidden" data-theme="dark-gold" data-style="transparent" aria-hidden="true">
    <header class="panel__header">
      <h1 id="i-title">⏱️ Outlaw • Time Control</h1>
      <button id="btn-close" class="btn ghost" title="Close">✕</button>
    </header>

    <section class="grid">
      <div class="card">
        <h2 id="i-section-state">État & Actions</h2>
        <div class="row">
          <button id="btn-freeze" class="btn">⏸️ Stop / Reprendre</button>
          <button data-jump="day_start"  class="btn" id="i-day-start">🌅 Début du jour</button>
          <button data-jump="day_end"    class="btn" id="i-day-end">🌇 Fin du jour</button>
          <button data-jump="night_start"class="btn" id="i-night-start">🌃 Début de nuit</button>
          <button data-jump="night_end"  class="btn" id="i-night-end">🌌 Fin de nuit</button>
        </div>
        <div class="row">
          <div class="inline">
            <label id="i-goto-label">Aller à (HH:MM)</label>
            <div class="inline">
              <input id="set-h" type="number" min="0" max="23" value="12" />
              <span>:</span>
              <input id="set-m" type="number" min="0" max="59" value="00" />
              <button id="btn-instant" class="btn ghost">Aller</button>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2 id="i-section-speed">Vitesse & Ratios</h2>
        <div class="row">
          <label for="mult" id="i-mult-label">Multiplicateur</label>
          <select id="mult">
            <option value="1">x1</option>
            <option value="2">x2</option>
            <option value="3">x3</option>
            <option value="4">x4</option>
            <option value="5">x5</option>
          </select>
          <button id="btn-mult" class="btn">Appliquer</button>
        </div>
        <div class="row two">
          <div>
            <label id="i-daylen-label">Durée du jour (min)</label>
            <input id="dayLen" type="number" min="1" value="45" />
          </div>
          <div>
            <label id="i-nightlen-label">Durée de la nuit (min)</label>
            <input id="nightLen" type="number" min="1" value="20" />
          </div>
        </div>
        <div class="row two">
          <div>
            <label id="i-daystart-label">Début du jour (heure)</label>
            <input id="dayStart" type="number" min="0" max="23" value="6" />
          </div>
          <div>
            <label id="i-nightstart-label">Début de la nuit (heure)</label>
            <input id="nightStart" type="number" min="0" max="23" value="20" />
          </div>
        </div>
        <div class="row">
          <button id="btn-lengths" class="btn">Sauver ratios</button>
          <button id="btn-starts" class="btn ghost">Sauver heures</button>
        </div>
      </div>

      <div class="card">
        <h2 id="i-section-info">Infos</h2>
        <div id="info" class="mono small"></div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
